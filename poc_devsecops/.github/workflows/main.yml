name: Django CI/CD with Security Analysis

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    types: [ opened, edited]
  push:


jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags

    # 1. Snyk Open Source - Check Python dependencies
    - name: Run Snyk to check for vulnerabilities in dependencies
      uses: snyk/actions/python@master
      continue-on-error: true # Continue since we want all the scans
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    # 2. Snyk Code - SAST scanning
    - name: Run Snyk Code SAST scan
      uses: snyk/actions/python@master
      continue-on-error: true # Continue since we want all the scans
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --code --severity-threshold=medium

    # 3.1 Snyk IaC - Check Infrastructure as Code files
    - name: Run Snyk IaC scan
      uses: snyk/actions/iac@master
      continue-on-error: true # Continue since we want all the scans
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    # 3.2 tfsec da Aqua Security - same as above but Snyk IaC was not behaving as expected
    - name: Run tfsec to check Terraform files
      uses: aquasecurity/tfsec-action@v1.0.0
      continue-on-error: true # Continue since we want all the scans
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3.3 Frontend dependency security checks
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm install
      working-directory: ./app/static
      continue-on-error: true

    # checks for vulnerabilities in npm-managed dependencies
    - name: Run npm audit
      run: npm audit --audit-level=high || true
      working-directory: ./app/static

    - name: Install retire.js
      run: npm install -g retire

    # checks for vulnerable JavaScript libraries in all JS files
    - name: Run retire.js scan
      run: retire --path ./app/static || true
      continue-on-error: true

  # 4. build step - using Azure
  build:
    runs-on: ubuntu-latest
    needs: [security]
    steps:
    - uses: actions/checkout@v4

    # 1. Login to Azure
    - uses: azure/login@v2
      with:
        client-id:     ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # 1.1 Login to Azure Container Registry
    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 2. Build & push — Docker Buildx action takes care of build, tag, push
    - uses: docker/build-push-action@v5
      with:
        context: ./
        push: true
        tags: |
          ${{ secrets.ACR_LOGIN_SERVER }}/myproject:latest
          ${{ secrets.ACR_LOGIN_SERVER }}/myproject:${{ github.sha }}

    # Snyk Container - Check Docker image
    - name: Run Snyk to check Docker image for vulnerabilities
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: ${{ secrets.ACR_LOGIN_SERVER }}/myproject:latest
        args: --file=Dockerfile --severity-threshold=high
      continue-on-error: true

  dast:
#    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      # headless automatic penetration testing with OWASP ZAP
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://${{ secrets.VM_PUBLIC_IP }}/"
        continue-on-error: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks to check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
